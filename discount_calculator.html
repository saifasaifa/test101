<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>โปรแกรมคำนวณส่วนลดสมาชิก</title>
<style>
:root{
  --bg:#f5f7f4; --surface:#ffffff; --ink:#1d2a24; --muted:#5c6b63;
  --line:#cfd8d2; --accent:#1f6f55; --accent-ink:#ffffff; --result:#e6f2ec;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121a16; --surface:#1b2620; --ink:#e8efea; --muted:#a2b2a9;
    --line:#33443b; --accent:#5fc59f; --accent-ink:#0f1a15; --result:#22382d;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  font-size:17px; line-height:1.65; padding:24px 16px 48px;
}
main{max-width:620px; margin:0 auto}
h1{font-size:1.5rem; margin:0 0 4px; font-weight:700}
.sub{color:var(--muted); margin:0 0 20px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px}
label{display:block; font-weight:600; margin:0 0 4px}
.hint{color:var(--muted); font-size:.9rem; margin:0 0 14px}
input{
  width:100%; font:inherit; color:inherit; background:var(--bg);
  border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:6px;
}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.row{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
button{
  font:inherit; font-weight:600; cursor:pointer; border-radius:8px; padding:10px 18px;
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
}
button.ghost{background:transparent; color:var(--accent)}
#out{margin-top:18px; padding:16px; border-radius:8px; background:var(--result); min-height:3.6em}
#out .big{font-size:1.7rem; font-weight:700; line-height:1.3}
#out.err{background:transparent; border:1px solid var(--line)}
h2{font-size:1.1rem; margin:28px 0 8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.95rem}
th,td{border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; white-space:nowrap}
th{color:var(--muted); font-weight:600}
td.num{font-variant-numeric:tabular-nums}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>โปรแกรมคำนวณส่วนลดสมาชิก</h1>
  <!-- <p class="sub">ป้อนค่าและเปรียบเทียบผลที่ได้ว่าตรงตามความต้องการ (REQUIREMENTS.md) หรือไม่</p> -->

  <form class="panel" id="f" autocomplete="off">
    <label for="price">ราคา (บาท)</label>
    <input id="price" inputmode="decimal" placeholder="เช่น 500">

    <label for="level">ระดับสมาชิก</label>
    <input id="level" list="levels" aria-describedby="levelhint" placeholder="เช่น gold">
    <datalist id="levels">
      <option value="none"><option value="silver"><option value="gold"><option value="platinum">
    </datalist>

    <div class="row">
      <button type="submit">คำนวณ</button>
      <button type="button" class="ghost" id="clear">ล้างประวัติ</button>
    </div>
    <div id="out" role="status" aria-live="polite"></div>
  </form>

  <h2>ประวัติการทดสอบ</h2>
  <div class="tablewrap">
    <table>
      <thead><tr><th>#</th><th>ราคา</th><th>ระดับสมาชิก</th><th>ราคาสุทธิ</th></tr></thead>
      <tbody id="hist"><tr><td colspan="4" class="empty">ยังไม่มีการคำนวณ</td></tr></tbody>
    </table>
  </div>
</main>

<script>

const MEMBER_RATES = { none: 0.00, silver: 0.05, gold: 0.10, platinum: 0.25 };

function round2(x) {
  if (Number.isInteger(x * 8) && Math.abs(x * 8) % 2 === 1) {
    const k = Math.floor(x * 100);
    return (k % 2 === 0 ? k : k + 1) / 100;
  }
  return Number(x.toFixed(2));
}

function calculateDiscount(price, memberLevel) {
  const rate = Object.prototype.hasOwnProperty.call(MEMBER_RATES, memberLevel)
    ? MEMBER_RATES[memberLevel] : 0.00;
  let net = price * (1 - rate);

  if (price > 1000) {
    net -= 50;
  }

  return round2(net);
}

const $ = (id) => document.getElementById(id);
const out = $("out"), hist = $("hist");
let count = 0;

function show(html, isErr) {
  out.className = isErr ? "err" : "";
  out.replaceChildren(...html);
}
function el(tag, text, cls) {
  const n = document.createElement(tag);
  n.textContent = text;
  if (cls) n.className = cls;
  return n;
}

$("f").addEventListener("submit", (e) => {
  e.preventDefault();
  const priceText = $("price").value.trim();
  const level = $("level").value.trim();
  const price = Number(priceText);

  if (priceText === "" || !Number.isFinite(price)) {
    show([el("div", `ช่องราคาต้องเป็นตัวเลข (ได้รับ: "${priceText}")`)], true);
    $("price").focus();
    return;
  }

  const result = calculateDiscount(price, level);
  const shown = result.toFixed(2);

  show([el("div", "ราคาสุทธิ"), el("div", shown + " บาท", "big")], false);

  if (count === 0) hist.replaceChildren();
  count += 1;
  const tr = document.createElement("tr");
  [count, price, level === "" ? "(ว่าง)" : level, shown].forEach((v, i) => {
    tr.appendChild(el("td", String(v), i === 0 || i === 1 || i === 3 ? "num" : ""));
  });
  hist.appendChild(tr);
});

$("clear").addEventListener("click", () => {
  count = 0;
  hist.replaceChildren();
  const tr = document.createElement("tr");
  const td = el("td", "ยังไม่มีการคำนวณ", "empty");
  td.colSpan = 4; tr.appendChild(td); hist.appendChild(tr);
  show([], false);
});
</script>
</body>
</html>
